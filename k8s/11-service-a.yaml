apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-a-sa
  namespace: svc-a-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: svc-a-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      # Service Identity cluster.local/ns/svc-a-ns/sa/svc-a-sa comes from this SA via ztunnel; no code involved
      serviceAccountName: svc-a-sa
      containers:
        - name: service-a
          image: istio-demo/service-a:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: portal-keys
              mountPath: /etc/portal-keys
              readOnly: true
      volumes:
        - name: portal-keys
          # public half of the Signing Key only, from k8s/60-secrets.yaml
          configMap:
            name: portal-public-key
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: svc-a-ns
spec:
  selector:
    app: service-a
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http   # tells the waypoint to treat this as HTTP
