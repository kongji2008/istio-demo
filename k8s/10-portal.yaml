apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-sa
  namespace: portal-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      # Service Identity cluster.local/ns/portal-ns/sa/portal-sa comes from this SA via ztunnel; no code involved
      serviceAccountName: portal-sa
      containers:
        - name: portal
          image: istio-demo/portal:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: portal-keys
              mountPath: /etc/portal-keys
              readOnly: true
      volumes:
        - name: portal-keys
          # Signing Key (private + public PEM) from k8s/60-secrets.yaml
          secret:
            secretName: portal-signing-key
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: portal-ns
spec:
  selector:
    app: portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http   # tells the waypoint to treat this as HTTP
