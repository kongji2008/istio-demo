apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-b-sa
  namespace: svc-b-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: svc-b-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      # Service Identity cluster.local/ns/svc-b-ns/sa/svc-b-sa comes from this SA via ztunnel; no code involved
      serviceAccountName: svc-b-sa
      containers:
        - name: service-b
          image: istio-demo/service-b:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: portal-keys
              mountPath: /etc/portal-keys
              readOnly: true
      volumes:
        - name: portal-keys
          # public half of the Signing Key only, from k8s/60-secrets.yaml
          configMap:
            name: portal-public-key
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: svc-b-ns
spec:
  selector:
    app: service-b
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      appProtocol: http   # tells the waypoint to treat this as HTTP
